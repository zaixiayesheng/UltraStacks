modLoader = "javafml"
loaderVersion = "[47,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/zaixiayesheng/UltraStacks/issues"

[[mods]]
modId = "ultrastacks"
version = "${version}"
displayName = "UltraStacks"
authors = "zaixiayesheng"
logoFile = "logo.png"
description = '''
Raises the item stack limit to a configurable value and makes containers, slots and saved data accept it.
'''

[[dependencies.ultrastacks]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ultrastacks]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ultrastacks]]
modId = "cloth_config"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
